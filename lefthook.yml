pre-commit:
  parallel: true
  commands:
    "biome check":
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,css}"
      run: npx @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    "go vet proxyrules":
      glob: "client/proxyrules/**/*.go"
      run: cd client/proxyrules && go vet ./...
    "go vet server":
      glob: "server/**/*.go"
      run: cd server/server && go vet ./...

commit-msg:
  commands:
    "commitlint":
      run: npx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    "biome ci":
      run: npx @biomejs/biome ci --files-ignore-unknown=true ./client/web ./client/packages ./packages ./client/scripts ./client/desktop ./client/mobile ./scripts
    "release script tests":
      run: node --test "scripts/release/*.test.mjs"
    "hook dependency ratchet":
      run: cd client && node scripts/check-hook-deps.mjs
    "protocol sync":
      run: cd client && node scripts/check-protocol-sync.mjs
    "radius tokens":
      run: cd client && node scripts/check-radius-tokens.mjs
    "desktop bridge contract":
      run: cd client && node scripts/check-desktop-commands.mjs
    "mobile bridge contract":
      run: cd client && node scripts/check-mobile-bridge.mjs
    "typecheck":
      run: pnpm typecheck
