# GOSpeak CI — 质量门禁（按路径精准触发，聚合 JS 构建）
# 保留 workflow_call 兼容外部调用；仓库内正式发布由 release.yml 独立负责。
name: CI

on:
  pull_request:
    branches: [release, dev]
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run server tests (Go)"
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      run_tests:
        description: "Run server tests (Go)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/release' }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      js: ${{ steps.filter.outputs.js }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            go:
              - 'app/server/**'
              - 'app/server/go.mod'
              - 'app/server/go.sum'
              - 'app/desktop/**/*.go'
              - 'app/desktop/go.mod'
              - 'app/desktop/go.sum'
              - 'app/shared/**'
            js:
              - 'app/web/**'
              - 'app/mobile/**'
              - 'app/desktop/mygo.config.ts'
              - 'app/desktop/package.json'
              - 'packages/**'
              - 'test/**'
              - 'package.json'
              - 'biome.json'
              - '**/tsconfig*.json'
              - '.npmrc'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            ci:
              - '.github/**'
              - 'deploy/**'
              - 'Dockerfile'
              - 'lefthook.yml'
              - 'commitlint.config.js'
              - 'scripts/**'

  lint:
    name: Lint (Biome + go vet)
    needs: changes
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
          needs.changes.outputs.go == 'true' || needs.changes.outputs.js == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm-install
        if: >-
          ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
              needs.changes.outputs.js == 'true' || needs.changes.outputs.ci == 'true' }}
      - name: Biome CI
        if: >-
          ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
              needs.changes.outputs.js == 'true' || needs.changes.outputs.ci == 'true' }}
        run: pnpm exec biome ci --files-ignore-unknown=true ./app/web ./packages ./scripts ./test ./app/desktop ./app/mobile
      - name: UI token guard (圆角 / 字号 / 文字层级 / 图标尺寸)
        if: >-
          ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
              needs.changes.outputs.js == 'true' || needs.changes.outputs.ci == 'true' }}
        run: node scripts/check-ui-tokens.mjs
      - name: Radius token guard
        # 此前只在 lefthook pre-push 跑，可被 --no-verify 绕过；CI 补上同一道门禁。
        if: >-
          ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
              needs.changes.outputs.js == 'true' || needs.changes.outputs.ci == 'true' }}
        run: node scripts/check-radius-tokens.mjs
      - name: Hook dependency ratchet (useExhaustiveDependencies)
        # biome 规则为 warn，不会让 biome ci 失败；棘轮脚本保证只许减少、不许新增。
        if: >-
          ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
              needs.changes.outputs.js == 'true' || needs.changes.outputs.ci == 'true' }}
        run: node scripts/check-hook-deps.mjs
      - name: Desktop bridge contract (Go bindings ↔ TS commands)
        if: >-
          ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
              needs.changes.outputs.js == 'true' || needs.changes.outputs.ci == 'true' }}
        run: |
          node --test scripts/check-desktop-commands.test.mjs
          node scripts/check-desktop-commands.mjs
      - name: Mobile bridge contract (plugin methods ↔ native)
        if: >-
          ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
              needs.changes.outputs.js == 'true' || needs.changes.outputs.ci == 'true' }}
        run: |
          node --test scripts/check-mobile-bridge.test.mjs
          node scripts/check-mobile-bridge.mjs
      - name: Deploy config guard (env 与 livekit.yaml 一致性)
        # 防止把 LiveKit 密钥硬编码回 livekit.yaml，或让 .env 与注入表达式脱节。
        # 校验逻辑单一来源在 deploy/init.sh --check，本地可直接复跑。
        run: ./deploy/init.sh --check
      - uses: actions/setup-go@v7
        if: >-
          ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
              needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true' }}
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
          cache: true
      - uses: ./.github/actions/go-build-cache
        with:
          go-sum-path: app/server/go.sum
          cache-prefix: server-lint
      - name: Vet
        if: >-
          ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
              needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true' }}
        run: cd app/server && go vet ./...

  typecheck:
    name: Typecheck
    needs: changes
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
          needs.changes.outputs.js == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm-install
      - name: Typecheck
        run: pnpm typecheck

  build-js:
    name: Build JS (turbo)
    needs: changes
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
          needs.changes.outputs.js == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm-install
      - name: Build JS
        run: pnpm turbo run build --filter=@gospeak/web
      - name: Build mobile web bundle
        run: pnpm turbo run build:mobile --filter=@gospeak/web
      - name: Upload web dist
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: app/web/dist
          retention-days: 3

  build-mobile:
    name: Build Mobile (Capacitor)
    needs: changes
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
          needs.changes.outputs.js == 'true' || needs.changes.outputs.ci == 'true' }}
    # 原生编译已实跑通过（Android assembleDebug + iOS simulator build 均绿），
    # 产物 gospeak-android-debug / gospeak-ios-simulator 供下载验证。
    #
    # 不阻塞 CI：macos-latest 排队常达 5-10 分钟，把它挂在 gate 上会让任意一次
    # 提交的合并门禁随 runner 队列抖动（实测同一提交墙钟 7min 与 17min 两档）。
    # 原生壳的回归由 release 前的人工验证兜底，日常提交只保留信号不设门禁。
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm-install
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # @capacitor/android 8.x 以 Java 21 为目标（sourceCompatibility VERSION_21），
          # 用 17 会在 :capacitor-android:compileDebugJavaWithJavac 报 invalid source release。
          java-version: '21'
      - name: Verify proxyrules binding surface
        # 只校验绑定面（gobind 符号集合），AAR/XCFramework 是否产出取决于 runner 上的工具链；
        # 本 job 是 continue-on-error，缺工具链时脚本以 exit 0 报告下一步，不制造红色噪音。
        run: node scripts/mobile-bind-proxyrules.mjs --target=all
      - name: Sync native projects
        run: pnpm --filter @gospeak/mobile sync
      - name: Build Android (assembleDebug)
        run: cd app/mobile/android && ./gradlew assembleDebug --no-daemon
      - name: Upload Android debug APK
        # 放在 iOS 步骤之前：iOS 失败时 APK 仍然上传成功，可直接下载验证。
        uses: actions/upload-artifact@v7
        with:
          name: gospeak-android-debug
          path: app/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
      - name: Build iOS (simulator, unsigned)
        # iOS 工程走 SPM（App/CapApp-SPM/Package.swift），没有 CocoaPods 的
        # .xcworkspace，因此必须用 -project 而不是 -workspace。
        run: |
          xcodebuild -project app/mobile/ios/App/App.xcodeproj \
            -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/gospeak-ios-derived \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package iOS simulator app
        # 用 ditto 而不是普通 zip：ditto 会保留 .app 的 bundle 目录结构、可执行位和
        # 符号链接，解压后仍是可安装的 App.app；裸 zip 容易把 bundle 拍平。
        run: |
          test -d /tmp/gospeak-ios-derived/Build/Products/Debug-iphonesimulator/App.app \
            || { echo "iOS simulator App.app missing"; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent \
            /tmp/gospeak-ios-derived/Build/Products/Debug-iphonesimulator/App.app \
            /tmp/gospeak-ios-simulator.zip
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v7
        with:
          name: gospeak-ios-simulator
          path: /tmp/gospeak-ios-simulator.zip
          retention-days: 7

  build-server:
    name: Build Server (Go)
    needs: [changes, build-js]
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
           needs.changes.outputs.go == 'true' || needs.changes.outputs.js == 'true' || needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
          cache: true
      - uses: ./.github/actions/go-build-cache
        with:
          go-sum-path: app/server/go.sum
          cache-prefix: server-build
      - name: Download web dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: app/web/dist
      - name: Embed frontend into server
        run: |
          rm -rf app/server/internal/webui/dist
          mkdir -p app/server/internal/webui/dist
          cp -R app/web/dist/. app/server/internal/webui/dist/
          test -f app/server/internal/webui/dist/index.html
      - name: Build
        working-directory: app/server
        env:
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o gospeak .

  test-server:
    name: Test Server (Go)
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
           needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true') &&
          (github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call' || inputs.run_tests) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
          cache: true
      - uses: ./.github/actions/go-build-cache
        with:
          go-sum-path: app/server/go.sum
          cache-prefix: server-test
      - name: Protocol gen-diff
        working-directory: app/server
        run: |
          go run ./cmd/gen-protocol
          git diff --exit-code -- ../web/src/protocol/generated
      - name: Test
        working-directory: app/server
        env:
          CGO_ENABLED: 0
        run: go test ./... -count=1
      - name: Test (race)
        # 并发敏感包必须过 -race：测试侧 mock 的非原子计数曾长期掩盖竞争。
        working-directory: app/server
        env:
          CGO_ENABLED: 1
        run: go test -race ./internal/signal/... ./internal/ws/... ./internal/bus/... -count=1

  test-web:
    name: Test Web (Vitest)
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
           needs.changes.outputs.js == 'true' || needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm-install
      - name: Web unit tests
        env:
          CI: "true"
        run: pnpm --filter @gospeak/web test

  test-packages:
    name: Test Packages (Vitest)
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
           needs.changes.outputs.js == 'true' || needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm-install
      - name: Package unit tests
        env:
          CI: "true"
        run: pnpm --filter @gospeak/components --filter @gospeak/desktop --filter @gospeak/sfu-client --filter @gospeak/mobile-capabilities test
      - name: Package tests (mobile target)
        env:
          CI: "true"
          GOSPEAK_TARGET: mobile
        run: pnpm --filter @gospeak/mobile-capabilities --filter @gospeak/desktop test
      - name: Package tests (desktop target)
        env:
          CI: "true"
          GOSPEAK_TARGET: desktop
        run: pnpm --filter @gospeak/desktop --filter @gospeak/mobile-capabilities test

  test-scripts:
    name: Test CI Scripts (node --test)
    # scripts/ 下的辅助脚本此前没有任何 CI 覆盖，导致 check-version 与
    # build-changelog 的单测长期处于失效状态却无人发现。
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
           needs.changes.outputs.ci == 'true' || needs.changes.outputs.js == 'true' ||
           needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/pnpm-install
      - name: Script unit tests
        run: node --test scripts/*.test.mjs
      - name: Release naming self-check
        run: |
          set -euo pipefail
          test "$(node scripts/release-naming.mjs tag server 1.0.0)" = "gospeak-server-v1.0.0"
          test "$(node scripts/release-naming.mjs tag desktop 1.0.0)" = "gospeak-desktop-v1.0.0"
          test "$(node scripts/release-naming.mjs artifact desktop 1.0.0 darwin arm64 dmg)" \
            = "gospeak-desktop-v1.0.0-darwin-arm64.dmg"
      - name: Version consistency (server)
        run: node scripts/check-version.mjs . "" server
      - name: Version consistency (desktop)
        run: node scripts/check-version.mjs . "" desktop
      - name: Version consistency (mobile)
        run: node scripts/check-version.mjs . "" mobile

  desktop-go:
    name: Desktop Host (Go)
    # app/desktop 是独立 Go module，go 指令要求 1.27.3，与 server 的 1.26 不同，
    # 因此单独一个 job 用自己的 setup-go 版本，避免 toolchain 隐式下载。
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
           needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/desktop/go.mod
          cache-dependency-path: app/desktop/go.sum
          cache: true
      - uses: ./.github/actions/go-build-cache
        with:
          go-sum-path: app/desktop/go.sum
          cache-prefix: desktop
      - name: Seed embed placeholder
        # proxyserver.go 用 //go:embed all:webui/dist 内嵌前端产物，而该目录
        # 由 mygo build 生成且被 gitignore。这里放一个占位文件，让 vet/test
        # 能在没有前端产物的干净 checkout 上编译。
        run: |
          mkdir -p app/desktop/webui/dist
          test -f app/desktop/webui/dist/index.html \
            || printf '<!doctype html><title>placeholder</title>\n' > app/desktop/webui/dist/index.html
      - name: Vet
        working-directory: app/desktop
        run: go vet ./...
      - name: Test shared proxyrules
        # 共享规则层被桌面与移动端同时依赖，必须独立跑测试，否则"一份测试三端共用"无人执行。
        working-directory: app/shared/proxyrules
        run: go vet ./... && go test ./... -count=1
      - name: Verify proxyrules binding surface
        # 放在这里而不是只放 build-mobile：build-mobile 只按 js/ci 触发，而 app/shared/**
        # 只在 go 过滤器里，只改共享规则层的提交不会触发它——门禁就形同虚设。
        # gobind 是纯代码生成，不需要 Xcode / Android SDK，ubuntu 即可跑，且本 job 在 gate 内。
        run: node scripts/mobile-bind-proxyrules.mjs --target=all
      - uses: ./.github/actions/pnpm-install
      - name: Build web (desktop target)
        run: pnpm --filter @gospeak/web build:desktop
      - name: Seed embed from build
        # proxyserver 测试校验真实 gzip 与完整 index.html，占位文件不满足，
        # 因此这里用真实桌面目标产物覆盖占位。
        run: |
          rm -rf app/desktop/webui/dist
          mkdir -p app/desktop/webui/dist
          cp -R app/web/dist/. app/desktop/webui/dist/
          test -f app/desktop/webui/dist/index.html
      - name: Test
        working-directory: app/desktop
        run: go test ./... -count=1

  workflow-lint:
    name: Workflow Lint (actionlint)
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' ||
           needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        # 固定版本，避免上游发版无声改变门禁结果。
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL "$url" | tar xz -C /tmp actionlint
          /tmp/actionlint -version
      - name: Lint workflows
        run: /tmp/actionlint -color

  gate:
    name: CI Gate
    if: always()
    # build-mobile 不在 needs 内：它 continue-on-error 且跑在 macos-latest，
    # 纳入 gate 只会把 macOS 排队时间转嫁成合并阻塞。
    needs: [lint, typecheck, build-js, build-server, test-server, test-web, test-packages, test-scripts, desktop-go, workflow-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required checks
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          BUILD_JS_RESULT: ${{ needs.build-js.result }}
          BUILD_SERVER_RESULT: ${{ needs.build-server.result }}
          TEST_SERVER_RESULT: ${{ needs.test-server.result }}
          TEST_WEB_RESULT: ${{ needs.test-web.result }}
          TEST_PACKAGES_RESULT: ${{ needs.test-packages.result }}
          TEST_SCRIPTS_RESULT: ${{ needs.test-scripts.result }}
          DESKTOP_GO_RESULT: ${{ needs.desktop-go.result }}
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
        run: |
          set -euo pipefail
          for result in "$LINT_RESULT" "$TYPECHECK_RESULT" "$BUILD_JS_RESULT" "$BUILD_SERVER_RESULT" "$TEST_SERVER_RESULT" "$TEST_WEB_RESULT" "$TEST_PACKAGES_RESULT" "$TEST_SCRIPTS_RESULT" "$DESKTOP_GO_RESULT" "$WORKFLOW_LINT_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "required CI job failed: $result" >&2; exit 1 ;;
            esac
          done
