name: CI

on:
  pull_request:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root:
    name: Root · workspace / release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm exec biome ci --files-ignore-unknown=true --no-errors-on-unmatched ./packages ./scripts/release
      - name: Release script tests
        run: node --test scripts/release/*.test.mjs
      - name: Version consistency
        run: node scripts/release/check-version.mjs . "" all
      - name: Submodule pins
        run: git submodule status --recursive

  server:
    name: Server · vet / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/server/go.mod
          cache-dependency-path: server/server/go.sum
      - run: cd server/server && go vet ./...
      - run: cd server/server && go build -o /tmp/gospeak main.go
      - run: cd server/server && go test ./...

  client:
    name: Client · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: cd client && pnpm install --frozen-lockfile
      - run: cd client && pnpm -r typecheck

  docs:
    name: Docs · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: cd docs && pnpm install --frozen-lockfile
      - run: cd docs && pnpm build
