name: CI

on:
  pull_request:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: JS · Biome / Typecheck / Build / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm exec biome ci --files-ignore-unknown=true ./client/web ./client/packages ./packages ./client/scripts ./client/desktop ./client/mobile ./scripts
      - name: Release script tests
        run: node --test "scripts/release/*.test.mjs"
      - name: Typecheck
        run: pnpm typecheck
      - name: Web build
        run: pnpm --filter @gospeak/web build
      - name: Web tests
        run: pnpm --filter @gospeak/web test

  server:
    name: Server · vet / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/server/go.mod
          cache-dependency-path: server/server/go.sum
      - name: Vet
        run: cd server/server && go vet ./...
      - name: Build
        run: cd server/server && go build -o /tmp/gospeak main.go
      - name: Test
        run: cd server/server && go test ./...

  docs:
    name: Docs · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gospeak/docs build
