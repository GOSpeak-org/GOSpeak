# GOSpeak Release CI —— 双组件、显式版本声明驱动、一版一个 Release。
#
# 版本号来源：.github/versions/server.yaml（服务端 + Web）与
# .github/versions/desktop.yaml（桌面端）各自显式声明。合入 release 后由
# version-bump.yml 自动打 tag；也可手动 push tag 或 workflow_dispatch 补跑。
#
# 命名规范（单一事实来源：scripts/release-naming.mjs）：
#   gospeak-<component>-v<semver>[-<os>-<arch>][.ext]
#
#   组件    tag                       二进制
#   server  gospeak-server-v1.0.0     gospeak-server-v1.0.0-linux-amd64
#   desktop gospeak-desktop-v1.0.0    gospeak-desktop-v1.0.0-darwin-arm64.dmg
#
#   校验和：SHA256SUMS-gospeak-<component>-v<version>.txt
#
# 发生什么（一组件一 Release）：
#   每个组件的 tag 各自创建一个独立 Release，只上传该组件自己的产物。
#   Releases 页按 tag 天然分开，不再出现「一个 Release 塞 20 个附件」。
#   latest 只由 server Release 抢占（--latest），desktop/mobile 用 --latest=false。
#
#   gospeak-server-v*  → 服务端发布链：版本校验（以 server.yaml 为准）→
#                        渲染服务端 Release 正文 → 一次性 Web 构建 →
#                        交叉编译 10 平台二进制 → SHA256SUMS。
#                        Docker 镜像由 docker.yml 并行发布。
#   gospeak-desktop-v* → 桌面端发布链：版本校验（以 desktop.yaml 为准）→
#                        GOSPEAK_TARGET=desktop 条件编译构建 Web →
#                        go:embed 进桌面宿主 → 5 平台安装包 → SHA256SUMS-desktop。
#   gospeak-mobile-v*  → 由 build-mobile.yml 处理（Capacitor/gradle 构建），
#                        不经过本 workflow。
#
# workflow_dispatch 支持手动补跑（tag 留空则取最新发布 tag），产物幂等覆盖（--clobber）。

name: Release

on:
  push:
    tags: ["gospeak-server-v*", "gospeak-desktop-v*"]
  # version-bump.yml 打完 tag 后直接调用本 workflow。
  # 不能只靠上面的 push.tags：version-bump 用 GITHUB_TOKEN 推 tag，
  # GitHub 会抑制由此派生的 workflow（防递归），tag 推上去了但发布不会跑。
  # workflow_call 是 job 级调用，不受该限制，也不需要额外 PAT。
  workflow_call:
    inputs:
      tag:
        description: "要发布的 tag（gospeak-<component>-v<version>）"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty = latest release tag)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # version-bump 会用 workflow_call 分别以 server / desktop tag 调用本 workflow。
  # 在 called workflow 里 github.ref 是调用方的 ref（refs/heads/release），
  # 只用 ref 分组会让两条发布链落到同一组、被串行执行（server 白等 desktop 十几分钟）。
  # 带上 inputs.tag 让两条链各用各的组并行；push / dispatch 无 inputs 时回退到 ref。
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # ── Resolve Tag & Component ─────────────────────────────────────────────
  resolve-tag:
    name: Resolve Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      component: ${{ steps.tag.outputs.component }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ] && [ "${GITHUB_EVENT_NAME:-}" = "push" ]; then
            tag="${GITHUB_REF_NAME:-}"
          fi
          if [ -z "$tag" ]; then
            # 最新发布 tag（两个组件混排，按创建时间取最新）
            tag="$(git for-each-ref --sort=-creatordate \
              --format='%(refname:short)' refs/tags \
              | grep -E '^gospeak-(server|desktop)-v[0-9]' | head -n1 || true)"
          fi
          parsed="$(node scripts/release-naming.mjs parse "$tag" || true)"
          if [ -z "$parsed" ]; then
            echo "::error::Tag '${tag}' does not follow gospeak-<component>-v<semver>"
            exit 1
          fi
          component="${parsed%% *}"
          version="${parsed##* }"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "component=$component"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Release tag: $tag (component=$component version=$version)"

  version-check:
    name: Check Release Version (${{ needs.resolve-tag.outputs.component }})
    runs-on: ubuntu-latest
    needs: [resolve-tag]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - name: Validate release tag against declared version
        env:
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
          COMPONENT: ${{ needs.resolve-tag.outputs.component }}
        run: node scripts/check-version.mjs . "$RELEASE_TAG" "$COMPONENT"
  # ── Create Release ───────────────────────────────────────────────────────
  # 一个版本只创建一个 GitHub Release：tag 固定为服务端 tag
  # （gospeak-server-v<version>），服务端二进制与桌面端安装包都上传到它。
  # 桌面端 tag 仍然存在，但只做构建触发与版本门禁 —— 再给它建 Release 会让
  # Releases 页对同一版本出现两条同名条目。
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve-tag, version-check]
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.body.outputs.release_tag }}
    env:
      RELEASE_VERSION: ${{ needs.resolve-tag.outputs.version }}
      # 一组件一 Release：标题、正文渲染、latest 分流都依赖当前组件。
      COMPONENT: ${{ needs.resolve-tag.outputs.component }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Render unified release body
        id: body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Release tag 取自 resolve-tag（哪个组件触发就用哪个 tag），不手拼。
          release_tag="${{ needs.resolve-tag.outputs.tag }}"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

          # notes 优先取版本声明 yaml 的 notes 字段（显式声明，支持块标量多行）；
          # 留空则按 commit 生成，基线只认本组件的历史 tag。
          cat > /tmp/read-notes.mjs <<'EOF'
          import { readFileSync } from "node:fs";
          const src = readFileSync(process.argv[2], "utf8");
          const block = src.match(/^notes:[ \t]*\|\n((?:[ \t]*[^\n]*\n?)+)/m);
          if (block) {
            console.log(block[1].replace(/^[ \t]+/gm, "").replace(/^\n+|\n+$/g, ""));
            process.exit(0);
          }
          const flow = src.match(/^notes:[ \t]*(?:"([^"]*)"|'([^']*)'|([^#\n]*))/m);
          console.log((flow ? (flow[1] ?? flow[2] ?? flow[3]) : "").trim());
          EOF

          declared() {
            node -e '
              const { readFileSync } = require("node:fs");
              const src = readFileSync(process.argv[1], "utf8");
              const m = src.match(/^version:[ \t]*["'"'"']?([^\s#"'"'"']+)["'"'"']?[ \t]*(?:#.*)?$/m);
              if (m) console.log(m[1]);
            ' "$1"
          }

          component_notes() {
            node /tmp/read-notes.mjs ".github/versions/$1.yaml" > /tmp/decl-notes.txt
            if [ -s /tmp/decl-notes.txt ]; then
              cp /tmp/decl-notes.txt "$2"
              return
            fi
            prefix="$(node scripts/release-naming.mjs prefix "$1")"
            current_tag="$(node scripts/release-naming.mjs tag "$1" "$RELEASE_VERSION")"
            base="$(git for-each-ref --sort=-creatordate \
              --format='%(refname:short)' refs/tags \
              | grep -F "$prefix" | grep -Fvx "$current_tag" | head -n1 || true)"
            if [ -n "$base" ]; then
              node scripts/build-changelog.mjs "$RELEASE_VERSION" "$base" --no-write > "$2"
            else
              echo "* 首个 $1 版本。" > "$2"
            fi
          }

          # 只生成当前组件的 release notes：一组件一 Release，正文不再混装。
          component_notes "$COMPONENT" "/tmp/${COMPONENT}-notes.md"

          node scripts/release-notes.mjs release \
            --component "$COMPONENT" \
            --version "$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$release_tag" \
            --notes-file "/tmp/${COMPONENT}-notes.md" \
            > /tmp/release-notes.md
          test -s /tmp/release-notes.md
          echo "::notice::release_tag=$release_tag component=$COMPONENT"
          head -20 /tmp/release-notes.md

      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="${{ steps.body.outputs.release_tag }}"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            # 服务端与服务端 tag 的两条发布链是并行跑的：先到的那条建 release，
            # 后到的这条只对齐正文（桌面端表格是后到的那条才拿得到的），
            # 不重复创建，也不动 Latest 归属。
            gh release view "$release_tag" --json body -q .body > /tmp/release-body-live.md
            if cmp -s /tmp/release-body-live.md /tmp/release-notes.md; then
              echo "Release $release_tag already up to date."
              exit 0
            fi
            echo "Release $release_tag exists; refreshing body."
            gh release edit "$release_tag" --notes-file /tmp/release-notes.md
            exit 0
          fi

          target_sha="$(git rev-parse "${release_tag}^{commit}")"
          case "$COMPONENT" in
            server)  title="GOSpeak Server v$RELEASE_VERSION" ;;
            desktop) title="GOSpeak Desktop v$RELEASE_VERSION" ;;
            mobile)  title="GOSpeak Mobile v$RELEASE_VERSION" ;;
            *)       title="GOSpeak v$RELEASE_VERSION" ;;
          esac
          args=(
            "$release_tag"
            --target "$target_sha"
            --title "$title"
            --notes-file /tmp/release-notes.md
          )
          # Latest 语义：只有 server Release 抢占 /releases/latest。
          # 文档下载卡与桌面端「前往下载页」都依赖 latest 指向服务端版本；
          # desktop / mobile Release 显式 --latest=false，避免覆盖。
          if [ "$COMPONENT" = "server" ]; then
            args+=(--latest)
          else
            args+=(--latest=false)
          fi
          if ! gh release create "${args[@]}" 2>/tmp/create-err.txt; then
            # 两条发布链同时创建时的竞态：对方先建好了，按「已存在」处理，
            # 正文由下面的对齐逻辑保证。
            if grep -qi 'already exists' /tmp/create-err.txt; then
              echo "::notice::Release $release_tag was created by a concurrent run; refreshing body."
              gh release edit "$release_tag" --notes-file /tmp/release-notes.md
              exit 0
            fi
            cat /tmp/create-err.txt >&2
            exit 1
          fi

  # ── Build Web Once（两个组件共用：desktop 以条件编译目标构建）──────────────
  build-web:
    name: Build Web Artifact
    runs-on: ubuntu-latest
    needs: [resolve-tag, version-check]
    permissions:
      contents: read
    env:
      # 桌面端以 GOSPEAK_TARGET=desktop 构建（__GOSPEAK_DESKTOP__=true，
      # 桌面分支进包）；主体按默认 web 目标构建（桌面分支被裁剪）。
      GOSPEAK_TARGET: ${{ needs.resolve-tag.outputs.component == 'desktop' && 'desktop' || 'web' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - uses: ./.github/actions/pnpm-install

      - name: Build web dist
        run: pnpm --filter @gospeak/web build

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-web-dist-${{ needs.resolve-tag.outputs.component }}
          path: app/web/dist
          retention-days: 3

  # ── 主体：Cross-Platform Server Binaries ────────────────────────────────
  build-release-binaries:
    name: Build server ${{ matrix.target }}
    if: needs.resolve-tag.outputs.component == 'server'
    runs-on: ubuntu-latest
    needs: [resolve-tag, version-check, create-release, build-web]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - target: linux-armv7
            goos: linux
            goarch: arm
            goarm: "7"
            ext: ""
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - target: freebsd-amd64
            goos: freebsd
            goarch: amd64
            ext: ""
          - target: freebsd-arm64
            goos: freebsd
            goarch: arm64
            ext: ""
          - target: openbsd-amd64
            goos: openbsd
            goarch: amd64
            ext: ""
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
          - target: windows-arm64
            goos: windows
            goarch: arm64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Download web artifact
        uses: actions/download-artifact@v8
        # 服务端偶发重压缩致 digest 不匹配（产物无损），warn 避免发布链被炸
        with:
          digest-mismatch: warn
          name: release-web-dist-${{ needs.resolve-tag.outputs.component }}
          path: app/web/dist

      - uses: actions/setup-go@v7
        with:
          go-version-file: app/server/go.mod
          cache: false
      - uses: ./.github/actions/go-build-cache
        with:
          go-sum-path: app/server/go.sum
          cache-prefix: release-server

      - name: Embed frontend into server
        run: |
          rm -rf app/server/internal/webui/dist
          mkdir -p app/server/internal/webui/dist
          cp -R app/web/dist/. app/server/internal/webui/dist/
          test -f app/server/internal/webui/dist/index.html

      - name: Resolve checked out commit
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve artifact name
        id: name
        env:
          VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          set -euo pipefail
          # 规范名由 release-naming.mjs 派生，workflow 里不手拼。
          # 用 matrix.target 而非 goos+goarch：linux-armv7 的 goarch 只是 arm，
          # 拼出来会丢 v7 版本位。
          echo "artifact=$(node scripts/release-naming.mjs artifact-target server "$VERSION" \
            '${{ matrix.target }}' '${{ matrix.ext }}')" >> "$GITHUB_OUTPUT"

      - name: Build binary
        working-directory: app/server
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          RELEASE_VERSION: ${{ needs.resolve-tag.outputs.version }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
          ARTIFACT: ${{ steps.name.outputs.artifact }}
        run: |
          go build \
            -ldflags="-s -w \
              -X 'GOSpeak/internal/buildinfo.Version=${RELEASE_VERSION}' \
              -X 'GOSpeak/internal/buildinfo.Commit=${RELEASE_COMMIT}'" \
            -o "$ARTIFACT" main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gospeak-server-${{ matrix.target }}
          path: app/server/${{ steps.name.outputs.artifact }}
          retention-days: 14

      - name: Upload to release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          ARTIFACT: ${{ steps.name.outputs.artifact }}
        run: |
          echo "Uploading to release $TAG..."
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not found; skipping upload."
            exit 0
          fi
          gh release upload "$TAG" "app/server/${ARTIFACT}" --clobber

  # ── 主体：SHA256SUMS ────────────────────────────────────────────────────
  checksums:
    name: Generate & Upload SHA256SUMS
    if: needs.resolve-tag.outputs.component == 'server'
    runs-on: ubuntu-latest
    needs: [resolve-tag, version-check, create-release, build-release-binaries]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        # 服务端偶发重压缩致 digest 不匹配（产物无损），warn 避免发布链被炸
        with:
          digest-mismatch: warn
          pattern: gospeak-server-*
          path: dist/
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        env:
          VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          set -euo pipefail
          # 文件名带组件与版本，服务端/桌面端产物不会互相覆盖或混淆。
          name="$(node "$GITHUB_WORKSPACE/scripts/release-naming.mjs" checksum server "$VERSION")"
          sha256sum gospeak-server-* > "$name"
          echo "=== $name ==="
          cat "$name"
          echo "checksum_file=$name" >> "$GITHUB_OUTPUT"
        id: sums

      - name: Upload SHA256SUMS to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          SUMS: ${{ steps.sums.outputs.checksum_file }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not found; skipping SHA256SUMS upload."
            exit 0
          fi
          gh release upload "$TAG" "dist/${SUMS}" --clobber

  # ── 桌面端：Cross-Platform Desktop Binaries ─────────────────────────────
  # ── 桌面端：macOS 安装包（DMG，需要 macOS runner 的 hdiutil）──────────────
  build-desktop-macos:
    name: Build desktop macOS (arm64 + amd64)
    if: needs.resolve-tag.outputs.component == 'desktop'
    # 两个架构都在同一台 macos-latest 上构建：Go/mygo 对 darwin/amd64 是纯
    # 交叉编译（CGO_ENABLED=0），hdiutil/codesign 与 CPU 架构无关。拆成两个
    # job 反而让第二个排队等 macOS runner（实测白等 10 分钟），setup-go 与
    # pnpm-install 也重复跑。mygo 每个架构输出到独立的 dist/darwin-<arch>/。
    runs-on: macos-latest
    needs: [resolve-tag, version-check, create-release, build-web]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Download web artifact
        uses: actions/download-artifact@v8
        # 服务端偶发重压缩致 digest 不匹配（产物无损），warn 避免发布链被炸
        with:
          digest-mismatch: warn
          name: release-web-dist-${{ needs.resolve-tag.outputs.component }}
          path: app/web/dist

      - uses: actions/setup-go@v7
        with:
          go-version-file: app/desktop/go.mod
          cache: false
      - uses: ./.github/actions/go-build-cache
        with:
          go-sum-path: app/desktop/go.sum
          cache-prefix: release-desktop

      # mygo 来自 app/desktop 的 devDependencies，必须装依赖才能调用
      - uses: ./.github/actions/pnpm-install

      - name: Embed frontend into desktop host
        run: |
          rm -rf app/desktop/webui/dist
          mkdir -p app/desktop/webui/dist
          cp -R app/web/dist/. app/desktop/webui/dist/
          test -f app/desktop/webui/dist/index.html

      - name: Resolve checked out commit
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # DMG 安装包：mygo build 产出 .app + dmg，Finder 里是「拖到 Applications」的
      # 标准安装体验。hdiutil 只有 macOS 有，所以这个作业跑在 macos runner 上。
      #
      # 版本号通过 MYGO_LDFLAGS 注入 main.version/main.commit（mygo 会把它们与
      # packageFlags 合并），保证 --version 与 tag 一致。
      - name: Build macOS app and DMG (arm64 + amd64)
        working-directory: app/desktop
        env:
          CGO_ENABLED: 0
          GOSPEAK_TARGET: desktop
          MYGO_LDFLAGS: >-
            -X 'main.version=${{ needs.resolve-tag.outputs.version }}'
            -X 'main.commit=${{ steps.source.outputs.commit }}'
        run: |
          set -euo pipefail
          for arch in arm64 amd64; do
            echo "=== building darwin/$arch ==="
            ./node_modules/.bin/mygo build \
              -skip-build-command \
              -platform "darwin/$arch"
          done

      # 用途说明缺失说明打包链路有问题：直接失败，不发一个麦克风不可用的包。
      - name: Verify bundles and normalize names
        working-directory: app/desktop
        env:
          VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          set -euo pipefail
          for arch in arm64 amd64; do
            dir="dist/darwin-$arch"
            APP="$(find "$dir" -maxdepth 1 -type d -name GOSpeak.app -print -quit)"
            test -n "$APP" -a -d "$APP"
            plutil -p "$APP/Contents/Info.plist" | grep -q NSMicrophoneUsageDescription
            plutil -p "$APP/Contents/Info.plist" | grep -q NSCameraUsageDescription
            DMG="$(find "$dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
            test -n "$DMG" -a -f "$DMG"
            # 挂载一次确认镜像可读且包含 .app 与 /Applications 链接。
            mnt="/tmp/gospeak-dmg-$arch"
            hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$mnt"
            ls "$mnt/GOSpeak.app" >/dev/null
            test -L "$mnt/Applications"
            hdiutil detach "$mnt"
            echo "DMG verified: $DMG"
            # mygo 产出的 dmg 名由 mygo.config.ts 的 version 决定，格式不受我们控制。
            # 统一重命名为 gospeak-desktop-v<ver>-darwin-<arch>.dmg，与 tag 命名对应。
            out="$(node "$GITHUB_WORKSPACE/scripts/release-naming.mjs" artifact desktop "$VERSION" darwin "$arch" dmg)"
            cp "$DMG" "dist/$out"
            echo "normalized: $DMG -> dist/$out"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gospeak-desktop-darwin
          path: app/desktop/dist/gospeak-desktop-v*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload to release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not found; skipping upload."
            exit 0
          fi
          shopt -s nullglob
          for f in app/desktop/dist/gospeak-desktop-v*.dmg; do
            echo "Uploading $f"
            gh release upload "$TAG" "$f" --clobber
          done

  # ── 桌面端：Linux / Windows 安装包 ──────────────────────────────────────
  build-desktop-others:
    name: Build desktop ${{ matrix.target }}
    if: needs.resolve-tag.outputs.component == 'desktop'
    runs-on: ubuntu-latest
    needs: [resolve-tag, version-check, create-release, build-web]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
          - target: windows-amd64
            goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Download web artifact
        uses: actions/download-artifact@v8
        # 服务端偶发重压缩致 digest 不匹配（产物无损），warn 避免发布链被炸
        with:
          digest-mismatch: warn
          name: release-web-dist-${{ needs.resolve-tag.outputs.component }}
          path: app/web/dist

      - uses: actions/setup-go@v7
        with:
          go-version-file: app/desktop/go.mod
          cache: false
      - uses: ./.github/actions/go-build-cache
        with:
          go-sum-path: app/desktop/go.sum
          cache-prefix: release-desktop

      # mygo 来自 app/desktop 的 devDependencies，必须装依赖才能调用
      - uses: ./.github/actions/pnpm-install

      - name: Embed frontend into desktop host
        run: |
          rm -rf app/desktop/webui/dist
          mkdir -p app/desktop/webui/dist
          cp -R app/web/dist/. app/desktop/webui/dist/
          test -f app/desktop/webui/dist/index.html

      - name: Resolve checked out commit
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # mygo 只在 Windows 上自动下载 NSIS；Linux runner 必须预装 makensis，
      # 否则它会跳过安装包只留下裸 exe（构建仍然"成功"，很容易漏掉）。
      - name: Install NSIS (Windows installer toolchain)
        if: matrix.goos == 'windows'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis
          makensis -VERSION

      # Linux 出 .deb（双击即装）+ tar.gz + install.sh（一键脚本）；
      # Windows 出 NSIS 安装包。两者都不需要宿主机是目标平台。
      - name: Build installers
        working-directory: app/desktop
        env:
          CGO_ENABLED: 0
          GOSPEAK_TARGET: desktop
          MYGO_LDFLAGS: >-
            -X 'main.version=${{ needs.resolve-tag.outputs.version }}'
            -X 'main.commit=${{ steps.source.outputs.commit }}'
        run: |
          ./node_modules/.bin/mygo build \
            -skip-build-command \
            -platform "${{ matrix.goos }}/${{ matrix.goarch }}"

      # mygo 在 makensis 缺失时只打一条 warning 并继续，构建仍"成功"，
      # 产物里没有安装包。这里显式断言，避免静默发出裸 exe。
      - name: Verify installers were produced
        working-directory: app/desktop
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ "${{ matrix.goos }}" = "windows" ]; then
            files=(dist/windows-*/*-setup-*.exe)
            if [ ${#files[@]} -eq 0 ]; then
              echo "::error::No Windows installer produced (NSIS missing?)"
              ls -la dist/windows-*/ || true
              exit 1
            fi
            echo "Windows installer: ${files[0]}"
          else
            debs=(dist/linux-*/*.deb)
            tarballs=(dist/linux-*/*.tar.gz)
            if [ ${#debs[@]} -eq 0 ] || [ ${#tarballs[@]} -eq 0 ]; then
              echo "::error::Missing Linux packages (.deb / .tar.gz)"
              ls -la dist/linux-*/ || true
              exit 1
            fi
            echo "Linux packages: ${debs[0]}, ${tarballs[0]}"
          fi

      - name: Normalize artifact names
        id: name
        working-directory: app/desktop
        env:
          VERSION: ${{ needs.resolve-tag.outputs.version }}
          GOOS: ${{ matrix.goos }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # 统一成 gospeak-desktop-v<ver>-<os>-<arch>.<ext>；install.sh 保持原名
          # （它是脚本而非二进制产物，改名会破坏文档里的安装指引）。
          naming="$GITHUB_WORKSPACE/scripts/release-naming.mjs"
          shopt -s nullglob
          files=()
          for src in dist/"${GOOS}"-*/*.deb dist/"${GOOS}"-*/*.tar.gz dist/"${GOOS}"-*/*-setup-*.exe; do
            case "$src" in
              *.deb)     ext=deb ;;
              *.tar.gz)  ext=tar.gz ;;
              *.exe)     ext=exe ;;
              *)         continue ;;
            esac
            out="$(node "$naming" artifact-target desktop "$VERSION" "$TARGET" "$ext")"
            cp "$src" "dist/$out"
            files+=("$out")
            echo "normalized: $src -> dist/$out"
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No packages to normalize"
            exit 1
          fi
          printf '%s\n' "${files[@]}" > /tmp/normalized.txt
          cat /tmp/normalized.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gospeak-desktop-${{ matrix.target }}
          path: |
            app/desktop/dist/gospeak-desktop-v*
            app/desktop/dist/${{ matrix.goos }}-*/install.sh
          if-no-files-found: error
          retention-days: 14

      - name: Upload to release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          GOOS: ${{ matrix.goos }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not found; skipping upload."
            exit 0
          fi
          shopt -s nullglob
          for f in app/desktop/dist/gospeak-desktop-v* \
                   app/desktop/dist/"${GOOS}"-*/install.sh; do
            echo "Uploading $f"
            gh release upload "$TAG" "$f" --clobber
          done

  desktop-checksums:
    name: Generate & Upload desktop SHA256SUMS
    if: needs.resolve-tag.outputs.component == 'desktop'
    runs-on: ubuntu-latest
    needs: [resolve-tag, version-check, create-release, build-desktop-macos, build-desktop-others]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v8
        # 服务端偶发重压缩致 digest 不匹配（产物无损），warn 避免发布链被炸
        with:
          digest-mismatch: warn
          pattern: gospeak-desktop-*
          path: dist/
          merge-multiple: true

      - name: Generate desktop SHA256SUMS
        id: sums
        working-directory: dist
        env:
          VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          set -euo pipefail
          # 产物是 dmg / deb / tar.gz / setup.exe / install.sh，名字各不相同，
          # 逐个列出而不是靠前缀通配。
          #
          # 注意：install.sh 是字面文件名而不是 glob，nullglob 对它无效——
          # 文件不存在时它仍会留在数组里，导致 sha256sum 报
          # "install.sh: No such file or directory"。所以单独判断存在性再追加。
          shopt -s nullglob
          files=(*.dmg *.deb *.tar.gz *.exe)
          for f in install.sh; do
            [ -f "$f" ] && files+=("$f")
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No desktop artifacts found to checksum"
            ls -la
            exit 1
          fi
          name="$(node "$GITHUB_WORKSPACE/scripts/release-naming.mjs" checksum desktop "$VERSION")"
          sha256sum "${files[@]}" | sort -k2 > "$name"
          echo "=== $name ==="
          cat "$name"
          echo "checksum_file=$name" >> "$GITHUB_OUTPUT"

      - name: Upload desktop SHA256SUMS to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          SUMS: ${{ steps.sums.outputs.checksum_file }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not found; skipping SHA256SUMS upload."
            exit 0
          fi
          gh release upload "$TAG" "dist/${SUMS}" --clobber

