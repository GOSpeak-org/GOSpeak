name: Aggregate Release

# 根仓只发**一个**聚合 Release：GOSpeak-YYMMDD。
# 实际产物与校验和都在三个子仓的 Release 里，这里只渲染表格直链过去。
on:
  push:
    tags:
      - "gospeak-server-v*"
      - "gospeak-web-v*"
      - "gospeak-desktop-v*"
      - "gospeak-mobile-v*"
  workflow_dispatch:
    inputs:
      date:
        description: "YYYYMMDD（留空 = 今天，Asia/Shanghai）"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: aggregate-release
  cancel-in-progress: false

jobs:
  aggregate:
    name: Render GOSpeak-YYMMDD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve date / tag
        id: d
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          date="${INPUT_DATE:-}"
          [ -n "$date" ] || date="$(TZ=Asia/Shanghai date +%Y%m%d)"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "tag=GOSpeak-$date" >> "$GITHUB_OUTPUT"
          echo "::notice::aggregate tag = GOSpeak-$date"

      - name: Render notes from sub-repo releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/render-aggregate.mjs --date "${{ steps.d.outputs.date }}" > /tmp/notes.md

      - name: Create or refresh aggregate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.d.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file /tmp/notes.md --latest
            echo "::notice::updated $tag"
          else
            gh release create "$tag" --title "GOSpeak ${{ steps.d.outputs.date }}" --notes-file /tmp/notes.md --latest
            echo "::notice::created $tag"
          fi
          head -12 /tmp/notes.md
