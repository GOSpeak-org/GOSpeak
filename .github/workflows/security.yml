name: Security

on:
  pull_request:
    branches: [release]
  push:
    branches: [release]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd client && pnpm audit --prod --audit-level critical || true

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/server/go.mod
          cache-dependency-path: server/server/go.sum
      - run: cd server/server && go run golang.org/x/vuln/cmd/govulncheck@latest ./...
