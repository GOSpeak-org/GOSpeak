# GOSpeak Docs —— VitePress 文档站，GitHub Pages 部署。
#
# 只在文档或其构建输入变化时跑：发版（push release）不会因为代码改动就重建站点。
# 站点产物目录固定为 docs/.vitepress/dist（vitepress 的相对根在 docs/）。
name: Docs

on:
  push:
    branches: [release]
    paths:
      - "docs/**"
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Build docs
        run: |
          set -euo pipefail
          pnpm --filter @gospeak/docs build
          test -f docs/.vitepress/dist/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
