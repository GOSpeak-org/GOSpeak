# GOSpeak 服务端（server + 内嵌 Web 前端）发布版本 —— 显式声明，CI 的单一事实来源。
#
# 发版流程：修改本文件的 version 并合入 release 后，version-bump.yml 会自动打上
# `gospeak-server-v<version>` tag，release.yml / docker.yml 随之构建发布。
#
# 该 tag 创建服务端自己的 GitHub Release，只含服务端产物（二进制 + SHA256SUMS）。
# 桌面端 / 移动端有各自的 tag 与 Release，互不混装；每个发版日主仓另有一个
# 按日期的聚合 Release（GOSpeak-YYMMDD）汇总当次四端资产。
#
# 命名规范（scripts/release/release-naming.mjs）：
#   tag      gospeak-server-v<version>
#   二进制   gospeak-server-v<version>-<os>-<arch>[.exe]
#   校验和   SHA256SUMS-gospeak-server-v<version>.txt
#
# 同步约束（scripts/release/check-version.mjs 会校验）：
#   server/VERSION
#   server/server/package.json 的 version
# 两者都必须与本文件一致；根 package.json 不承载版本，也不参与校验。
version: "1.4.0-rc.1"

# 本次发版说明：优先作为 GitHub Release 的 release notes（块标量 | 多行）。
# 留空时由 scripts/release/build-changelog.mjs 按 conventional commits 生成，
# 基线只取本组件的历史 tag。
notes: |
  GOSpeak Server 1.4.0-rc.1 —— monorepo 合并后首个四端统一的版本。

  内容与旧仓 GOSpeak-Server 的同名版本一致：本次顺延只换仓库与发版链路，
  服务端代码、协议与内嵌前端产物都没有功能变化。

  ## 功能
  - 屏幕共享按需订阅：仅在点击成员卡片后订阅远端音视频，切换客户端时中断过期订阅
  - 静音与成员管理流程迁移到 user_uuid 跨层标识
  - Web 前端（1.4.0-rc.1）产物内嵌进二进制，单文件即可完整运行

  ## 修复
  - 精简版 docker-compose 的 NATS 卷与端口策略修正，撤销多余的 NATS 卷挂载
  - monorepo 目录迁移后的陈旧路径修正：构建、脚本与文档统一指向 server/ client/ docs/
