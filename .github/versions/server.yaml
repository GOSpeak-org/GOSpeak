# GOSpeak 服务端（server + web）发布版本 —— 显式声明，CI 的单一事实来源。
#
# 发版流程：修改本文件的 version 并合入 release 后，version-bump.yml 会自动打上
# `gospeak-server-v<version>` tag，release.yml / docker.yml 随之构建发布。
#
# 该 tag 同时是这个版本唯一的 GitHub Release：桌面端安装包也上传到这里
# （桌面端 tag 只做构建触发与版本门禁，不再单独建 Release）。
#
# 命名规范（scripts/release-naming.mjs）：
#   tag      gospeak-server-v<version>
#   二进制   gospeak-server-v<version>-<os>-<arch>[.exe]
#   校验和   SHA256SUMS-gospeak-server-v<version>.txt
#
# 同步约束（release.yml 的 version-check 会校验）：根 VERSION 与根 package.json
# 的 version 必须与本文件一致。
version: "1.1.0-rc.4"

# 本次发版说明：优先作为 GitHub Release 的 release notes（块标量 | 多行）。
# 留空时由 scripts/build-changelog.mjs 按 conventional commits 生成，
# 基线只取本组件的历史 tag。
notes: |
  GOSpeak 1.1.0-rc.4 —— 语音房与 IM 体验增强、OAuth PKCE、推送通知与多端稳定性修复。

  ## 语音房与音视频
  - 共享画面支持多人切换并使用原生全屏控件
  - 广播本地说话状态；文本房移除人数上限并打磨房间体验
  - 修复安卓语音房因非同源 LiveKit 地址自动断连

  ## 聊天与通知
  - 私聊补充对方名称与头像，消息删除状态与会话查询更稳健
  - 通知中心重新设计并支持全部标为已读；新增 Push token 注册与通知入口
  - 事件协议对齐并补充 C2S 请求 payload

  ## 权限与认证
  - 允许跳过默认管理员密码修改
  - OAuth 新增 PKCE 流程与账号绑定

  ## Web / UI
  - 侧边栏设置入口调整，导航高亮与移动端触摸目标优化
  - 通用 UI token 收敛并加固检查；新增移动端设置页与跨平台服务器地址配置
  - 错误提示去重窗口延长至 30 秒，后台请求静默与提示中文化

  ## 桌面端
  - 原生能力 fallback 与桥接契约加固，冷启动即时而入

  ## 部署与依赖
  - 新增一键二进制安装脚本（含 LiveKit 下载）
  - 统一本地与 S3 存储后端；三端共享服务器地址归一规则
  - 升级 livekit-client、objectstore 与 biome 等依赖
