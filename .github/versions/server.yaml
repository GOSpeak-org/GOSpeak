# GOSpeak 服务端（server + web）发布版本 —— 显式声明，CI 的单一事实来源。
#
# 发版流程：修改本文件的 version 并合入 release 后，version-bump.yml 会自动打上
# `gospeak-server-v<version>` tag，release.yml / docker.yml 随之构建发布。
#
# 该 tag 同时是这个版本唯一的 GitHub Release：桌面端安装包也上传到这里
# （桌面端 tag 只做构建触发与版本门禁，不再单独建 Release）。
#
# 命名规范（scripts/release-naming.mjs）：
#   tag      gospeak-server-v<version>
#   二进制   gospeak-server-v<version>-<os>-<arch>[.exe]
#   校验和   SHA256SUMS-gospeak-server-v<version>.txt
#
# 同步约束（release.yml 的 version-check 会校验）：根 VERSION 与根 package.json
# 的 version 必须与本文件一致。
version: "1.2.0-rc.1"

# 本次发版说明：优先作为 GitHub Release 的 release notes（块标量 | 多行）。
# 留空时由 scripts/build-changelog.mjs 按 conventional commits 生成，
# 基线只取本组件的历史 tag。
notes: |
  GOSpeak 1.2.0-rc.1 —— 域内房间分组与个人布局、安全加固与多端体验优化。

  ## 房间分组与布局
  - 域内房间支持自定义分组、拖拽排序与个人布局持久化
  - WS 房间列表携带分组布局并据此排序，HTTP 接口与迁移配套落地
  - 房间列表收起分组不留空洞；布局缺帧时房间按未分组展示

  ## 安全加固
  - 全局 CSP 与安全响应头，Swagger 单独放宽
  - 强制管理员修改默认口令，收紧 token 失效与 JWT 归属校验
  - 堵住经 SFU 入房凭空建房的权限绕过，清理双通道越权
  - 删域改为事务内完整级联，消除孤儿数据
  - 权限判定改为服务端下发，移除前端手抄兜底表
  - 移除 no-op 的 provider 热切换入口

  ## 语音房与 Web
  - 房间人数下限归一化为 2，修复切房竞态导致新房连接被旧会话阻塞
  - 个人自定义背景图与三档玻璃强度；按房间身份变化驱动进出房提示音
  - tooltip 与浮层定位统一，避免滚动错位和裁切
  - 管理端禁言时长改下拉框并修正表单布局
  - 发现页状态概览与英雄引导区；关于页新增 GitHub 项目链接

  ## 桌面端
  - 剪贴板走能力门面，事件名建单一事实源与门禁
  - 新增 Browser.OpenExternal 桥接命令与浏览器外链能力

  ## 工具链
  - 升级 Go 至 1.27.4 修复 net/http 漏洞
  - govulncheck 固定版本升级；镜像拉取策略默认改为 always
