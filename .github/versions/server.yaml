# GOSpeak 服务端（server + web）发布版本 —— 显式声明，CI 的单一事实来源。
#
# 发版流程：修改本文件的 version 并合入 release 后，version-bump.yml 会自动打上
# `gospeak-server-v<version>` tag，release.yml / docker.yml 随之构建发布。
#
# 命名规范（scripts/release-naming.mjs）：
#   tag      gospeak-server-v<version>
#   二进制   gospeak-server-v<version>-<os>-<arch>[.exe]
#   校验和   SHA256SUMS-gospeak-server-v<version>.txt
#
# 同步约束（release.yml 的 version-check 会校验）：根 VERSION 与根 package.json
# 的 version 必须与本文件一致。
version: "1.1.0-rc.1"

# 本次发版说明：优先作为 GitHub Release 的 release notes（块标量 | 多行）。
# 留空时由 scripts/build-changelog.mjs 按 conventional commits 生成，
# 基线只取本组件的历史 tag。
notes: |
  GOSpeak 1.1.0-rc.1 —— 三端样式平台适配与共享反代规则层。

  ## 新增
  - 平台样式适配层：构建目标写入 <html data-platform>，Web / 桌面 / 移动三端的
    样式差异收敛到一处，业务分支仍只用 inDesktop() / inMobile()
  - 三端共享反代纯规则 app/shared/proxyrules：地址校验、Set-Cookie 改写与
    worker 白名单只有一份实现，桌面宿主直接 import，移动端经 gomobile 绑定调用
  - 系统偏好兜底：color-scheme 跟随明暗、reduced-motion 全局降级、
    prefers-contrast 提升对比

  ## 修复
  - 非 JSON 错误响应不再弹出空白错误提示
  - Set-Cookie 属性改为按名称匹配、worker 目标按原始 URL 解析，
    反代白名单判定更准确

  ## 移动端
  - Android / iOS 原生侧删除内联反代实现，统一调用共享规则
  - gomobile 绑定面纳入 CI 门禁：gobind 静默跳过导出函数会被拦下
