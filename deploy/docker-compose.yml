# =============================================================================
# GOSpeak 简化部署入口（app + LiveKit）
# =============================================================================
# 只保留跑通语音所需的两个服务，不含 PostgreSQL / RustFS / Caddy / 可观测性栈。
# 数据库用 SQLite，存储用本地磁盘，开箱即用。
#
# 公共定义在 docker-compose.base.yml（同目录），本文件只声明档位差异。
#
# 用法（在仓库根目录执行）:
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml logs -f gospeak
#   docker compose -f deploy/docker-compose.yml down
#
# 配置来源与全档位版一致：deploy/.env（用 deploy/init.sh 生成）
#
# 与全档位版的区别：
#   - 无 profiles，up 即起，不读 COMPOSE_PROFILES
#   - 没有 postgres / rustfs / caddy / prometheus / alertmanager / grafana / loki / promtail
#   - 没有 NATS 独立卷（KV 落在 gospeak-db 卷内的 /app/db/nats）
#
# 需要 PostgreSQL、对象存储或监控时，改用 docker-compose.standard.yml。
# =============================================================================

name: gospeak

include:
  - docker-compose.base.yml
